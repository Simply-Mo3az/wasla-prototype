<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 960" width="920" height="960" style="background:#F1F5F9; font-family:'Alexandria', 'Cairo', 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#004095" flood-opacity="0.32"/>
    </filter>
    <filter id="floatingShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <!-- Gradients -->
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004095"/>
      <stop offset="100%" stop-color="#002D6B"/>
    </linearGradient>
    <linearGradient id="mapWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6E6F7"/>
      <stop offset="100%" stop-color="#C2DCF5"/>
    </linearGradient>
  </defs>

  <!-- ===================================================================== -->
  <!-- SCREEN 1: SPLASH SCREEN (412 x 917)                                   -->
  <!-- ===================================================================== -->
  <g id="Screen_1_Splash" transform="translate(20, 20)">
    <!-- Screen Container -->
    <rect width="412" height="917" rx="36" fill="url(#splashGrad)"/>

    <!-- Android Status Bar -->
    <g id="StatusBar_Splash" fill="#FFFFFF" opacity="0.9">
      <text x="36" y="32" font-size="14" font-weight="600" text-anchor="start">9:41</text>
      <!-- Battery Icon -->
      <rect x="356" y="22" width="20" height="11" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="358" y="24" width="13" height="7" rx="1.5" fill="#FFFFFF"/>
      <path d="M377 25.5v4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Wifi Icon -->
      <path d="M336 29a4 4 0 0 1 6 0M333 26a8.5 8.5 0 0 1 12 0M330 23a13 13 0 0 1 18 0" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Cell Icon -->
      <path d="M312 30h3M316 27h3M320 24h3M324 21h3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Center Brand Area -->
    <g id="Brand_Logo" transform="translate(206, 420)">
      <!-- Main Wasla Typographic Graphic (Clean Vector Recreation) -->
      <g transform="translate(-130, -60)">
        <!-- Arabic Logo Letters: Waw, Sad, Lam, Teh Marbuta with Integrated Arrow -->
        <path d="M220 20 h-35 v35 h-25 v-45 h-35 v45 h-45 v-35 h-35 v55 h80 v25 l-25 25 h35 l30 -25 v-25 h55 z" fill="#FFFFFF"/>
        <!-- Dot of Teh Marbuta & Letter Accents -->
        <rect x="195" y="45" width="12" height="12" fill="#FFFFFF"/>
        <rect x="145" y="45" width="12" height="12" fill="#FFFFFF"/>
        <!-- Directional Arrow Cutout -->
        <path d="M125 105 l-20 20 l20 20 v-12 h35 v-16 h-35 z" fill="#FFFFFF"/>
      </g>

      <!-- Tagline -->
      <text x="0" y="90" fill="#EBF2FF" font-size="20" font-weight="600" text-anchor="middle" direction="rtl">
        موصلك لكل حتة
      </text>
      <!-- Secondary English Subtitle -->
      <text x="0" y="116" fill="#A5C4F5" font-size="12" font-weight="500" letter-spacing="2" text-anchor="middle">
        WASLA • SMART COMMUTE
      </text>
    </g>

    <!-- Bottom Indicator -->
    <g transform="translate(206, 860)">
      <circle cx="-16" cy="0" r="4" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="16" cy="0" r="4" fill="#FFFFFF" opacity="0.3"/>
      <text x="0" y="32" fill="#93B8F2" font-size="11" font-weight="500" text-anchor="middle">
        الإصدار 1.0 • صنع في مصر
      </text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- SCREEN 2: IMPROVED HOME & BOOKING (412 x 917)                         -->
  <!-- ===================================================================== -->
  <g id="Screen_2_Home_Improved" transform="translate(472, 20)">
    <!-- Screen Container -->
    <rect width="412" height="917" rx="36" fill="#F8FAFC"/>

    <!-- Map Background Section (Mid-canvas) -->
    <g id="Map_Context" transform="translate(0, 0)">
      <!-- Map Background Surface -->
      <rect width="412" height="460" rx="36" fill="#EBF0F5"/>
      <!-- River / Canal Vector Curve (Nile stylization) -->
      <path d="M-20 180 Q100 220 180 160 T380 200 T440 180" fill="none" stroke="url(#mapWater)" stroke-width="48" stroke-linecap="round"/>
      <!-- Road Grids -->
      <path d="M0 120 L412 140 M0 280 L412 260 M80 0 L120 460 M260 0 L240 460 M340 0 L360 460" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <path d="M-10 190 L420 220 M140 0 L180 460" stroke="#FEEA9A" stroke-width="5" opacity="0.9"/>
      <!-- Map Road Labels -->
      <rect x="220" y="128" width="84" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="262" y="141" fill="#64748B" font-size="9" font-weight="600" text-anchor="middle">الطريق الدائري</text>

      <rect x="70" y="268" width="88" height="18" rx="9" fill="#FFFFFF" opacity="0.9"/>
      <text x="114" y="281" fill="#64748B" font-size="9" font-weight="600" text-anchor="middle">محور 26 يوليو</text>

      <!-- Active User Pin (Cairo Location) -->
      <g transform="translate(206, 230)">
        <circle cx="0" cy="0" r="28" fill="#004095" opacity="0.12"/>
        <circle cx="0" cy="0" r="14" fill="#004095" opacity="0.25"/>
        <circle cx="0" cy="0" r="7" fill="#004095"/>
        <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
        <!-- Label Callout -->
        <g transform="translate(0, -28)">
          <rect x="-42" y="-18" width="84" height="22" rx="11" fill="#0F172A" filter="url(#floatingShadow)"/>
          <text x="0" y="-4" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">موقعك الحالي</text>
        </g>
      </g>
    </g>

    <!-- Top Floating Header Bar (RTL) -->
    <g id="Header_Bar" transform="translate(16, 44)">
      <!-- Android Status Bar (Dark text on light map) -->
      <g fill="#0F172A">
        <text x="16" y="-8" font-size="14" font-weight="600">9:41</text>
        <rect x="336" y="-18" width="20" height="11" rx="3" fill="none" stroke="#0F172A" stroke-width="1.5"/>
        <rect x="338" y="-16" width="13" height="7" rx="1.5" fill="#0F172A"/>
        <path d="M316 -11a4 4 0 0 1 6 0M313 -14a8.5 8.5 0 0 1 12 0" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- Floating Card Header -->
      <rect x="0" y="10" width="380" height="56" rx="28" fill="#FFFFFF" filter="url(#floatingShadow)"/>

      <!-- User Greeting & Avatar (Right side for RTL) -->
      <g transform="translate(366, 38)">
        <!-- Avatar Circle -->
        <circle cx="-16" cy="0" r="18" fill="#004095"/>
        <text x="-16" y="5" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">م</text>
        <!-- Greeting Text -->
        <text x="-44" y="-3" fill="#64748B" font-size="11" font-weight="500" text-anchor="end" direction="rtl">مساء الخير 👋</text>
        <text x="-44" y="14" fill="#0F172A" font-size="14" font-weight="700" text-anchor="end" direction="rtl">معاذ أحمد</text>
      </g>

      <!-- Left Notification Button -->
      <g transform="translate(28, 38)">
        <circle cx="0" cy="0" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Bell Icon -->
        <path d="M-4 3 h8 v2 h-8 z M-5 3 c0 -4 2 -6 5 -6 s5 2 5 6 v2 h-10 z" fill="#475569"/>
        <circle cx="4" cy="-5" r="3.5" fill="#EF4444"/>
      </g>
    </g>

    <!-- Bottom Sheet / Booking Card -->
    <g id="Booking_Sheet" transform="translate(0, 370)">
      <!-- Card Container with Top Rounded Corners -->
      <rect width="412" height="476" rx="28" fill="#FFFFFF" filter="url(#cardShadow)"/>

      <!-- Sheet Handle -->
      <rect x="188" y="12" width="36" height="4" rx="2" fill="#CBD5E1"/>

      <!-- Title: "هتروح فين النهارده؟" -->
      <text x="388" y="48" fill="#0F172A" font-size="18" font-weight="700" text-anchor="end" direction="rtl">
        هتروح فين النهارده؟
      </text>

      <!-- ============================================== -->
      <!-- INPUT 1: ORIGIN (Pickup)                       -->
      <!-- ============================================== -->
      <g transform="translate(20, 68)">
        <!-- Input Frame (Height: 52px, Radius: 14px) -->
        <rect width="372" height="52" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

        <!-- Green Origin Dot Icon (Right side for RTL) -->
        <circle cx="348" cy="26" r="6" fill="#10B981"/>
        <circle cx="348" cy="26" r="10" fill="#10B981" opacity="0.2"/>

        <!-- Corrected Text (موقعي الحالي with Qaf!) -->
        <text x="326" y="32" fill="#0F172A" font-size="14" font-weight="600" text-anchor="end" direction="rtl">
          موقعي الحالي
        </text>

        <!-- Left Change Badge -->
        <g transform="translate(14, 12)">
          <rect width="54" height="28" rx="14" fill="#EBF2FF"/>
          <text x="27" y="18" fill="#004095" font-size="12" font-weight="700" text-anchor="middle">تغيير</text>
        </g>
      </g>

      <!-- Connecting Vertical Track Indicator -->
      <line x1="368" y1="126" x2="368" y2="134" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- ============================================== -->
      <!-- INPUT 2: DESTINATION (Drop-off)                -->
      <!-- ============================================== -->
      <g transform="translate(20, 134)">
        <!-- Input Frame (Active / Elevated) -->
        <rect width="372" height="52" rx="14" fill="#FFFFFF" stroke="#004095" stroke-width="1.5"/>

        <!-- Red Destination Pin Icon (Right side for RTL) -->
        <circle cx="348" cy="26" r="6" fill="#EF4444"/>
        <circle cx="348" cy="26" r="10" fill="#EF4444" opacity="0.2"/>

        <!-- High-Contrast Accessible Placeholder Text -->
        <text x="326" y="32" fill="#64748B" font-size="13" font-weight="500" text-anchor="end" direction="rtl">
          رايح فين..؟ (مثلاً: التجمع الخامس، 6 أكتوبر)
        </text>
      </g>

      <!-- ============================================== -->
      <!-- RECENT TRIPS SECTION ("مشاويرك")              -->
      <!-- ============================================== -->
      <g transform="translate(20, 204)">
        <!-- Section Header -->
        <text x="368" y="16" fill="#475569" font-size="14" font-weight="700" text-anchor="end" direction="rtl">
          مشاويرك السابقة
        </text>

        <!-- Chips Row (Right-to-Left RTL Order!) -->
        <!-- Chip 1 (Rightmost): جامعة بنها -->
        <g transform="translate(254, 30)">
          <rect width="118" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <!-- Clock Icon -->
          <circle cx="102" cy="20" r="6" fill="none" stroke="#004095" stroke-width="1.5"/>
          <path d="M102 17v3l2 1" stroke="#004095" stroke-width="1.5" stroke-linecap="round"/>
          <text x="88" y="24" fill="#004095" font-size="13" font-weight="600" text-anchor="end" direction="rtl">
            جامعة بنها
          </text>
        </g>

        <!-- Chip 2 (Middle): محطة عدلي منصور -->
        <g transform="translate(108, 30)">
          <rect width="138" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <circle cx="122" cy="20" r="6" fill="none" stroke="#004095" stroke-width="1.5"/>
          <path d="M122 17v3l2 1" stroke="#004095" stroke-width="1.5" stroke-linecap="round"/>
          <text x="108" y="24" fill="#004095" font-size="13" font-weight="600" text-anchor="end" direction="rtl">
            محطة عدلي منصور
          </text>
        </g>

        <!-- Chip 3 (Leftmost): القرية الذكية -->
        <g transform="translate(0, 30)">
          <rect width="100" height="40" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
          <circle cx="84" cy="20" r="6" fill="none" stroke="#004095" stroke-width="1.5"/>
          <path d="M84 17v3l2 1" stroke="#004095" stroke-width="1.5" stroke-linecap="round"/>
          <text x="70" y="24" fill="#004095" font-size="13" font-weight="600" text-anchor="end" direction="rtl">
            القرية الذكية
          </text>
        </g>
      </g>

      <!-- ============================================== -->
      <!-- PRIMARY ACTION BUTTON ("وصلني")                -->
      <!-- ============================================== -->
      <g transform="translate(20, 294)">
        <!-- Full-Width 372px Button with Elevation -->
        <rect width="372" height="54" rx="16" fill="#004095" filter="url(#btnShadow)"/>
        <!-- Text & Navigation Arrow -->
        <text x="186" y="34" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle" direction="rtl">
          وصلني
        </text>
        <!-- Arrow Icon -->
        <path d="M136 27l-5 5 5 5 M131 32h14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- ============================================== -->
      <!-- BOTTOM NAVIGATION BAR (70px)                   -->
      <!-- ============================================== -->
      <g transform="translate(0, 368)">
        <rect width="412" height="78" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

        <!-- Active Indicator Bar on Home Tab (Rightmost in RTL) -->
        <rect x="330" y="0" width="44" height="3" rx="1.5" fill="#004095"/>

        <!-- Tab 1: الرئيسية (Home - Active) -->
        <g transform="translate(352, 28)">
          <!-- Home Icon -->
          <path d="M-8 2 l8 -8 l8 8 v10 h-5 v-6 h-6 v6 h-5 z" fill="#004095"/>
          <text x="0" y="24" fill="#004095" font-size="11" font-weight="700" text-anchor="middle">الرئيسية</text>
        </g>

        <!-- Tab 2: رحلاتي (Rides) -->
        <g transform="translate(254, 28)">
          <!-- Car / Trip Icon -->
          <path d="M-7 4 h14 v6 h-14 z M-5 4 l2 -6 h6 l2 6 z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="0" y="24" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle">رحلاتي</text>
        </g>

        <!-- Tab 3: المحفظة (Wallet) -->
        <g transform="translate(156, 28)">
          <!-- Wallet Icon -->
          <rect x="-8" y="-6" width="16" height="13" rx="2" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <circle cx="2" cy="0" r="1.5" fill="#94A3B8"/>
          <text x="0" y="24" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle">المحفظة</text>
        </g>

        <!-- Tab 4: حسابي (Profile) -->
        <g transform="translate(58, 28)">
          <!-- User Icon -->
          <circle cx="0" cy="-3" r="4.5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <path d="M-7 8 c0 -3.5 3 -5 7 -5 s7 1.5 7 5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="0" y="24" fill="#94A3B8" font-size="11" font-weight="500" text-anchor="middle">حسابي</text>
        </g>
      </g>
    </g>
  </g>
</svg>
